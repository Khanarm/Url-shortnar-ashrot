<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - aShort</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<section class="hero">

    <div class="shortener-box">

        <h1>👤 Create Account</h1>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <p class="{{ category }}">
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Register Form -->
        <form method="POST">

            <!-- Username -->
            <input
                type="text"
                name="username"
                placeholder="Username"
                minlength="3"
                maxlength="30"
                pattern="[a-zA-Z0-9_]+"
                autocomplete="username"
                required>


            <!-- Gmail -->
            <input
                type="email"
                name="email"
                placeholder="Gmail ID"
                autocomplete="email"
                required>


            <!-- Password -->
            <input
                type="password"
                name="password"
                placeholder="Password"
                minlength="6"
                autocomplete="new-password"
                required>


            <!-- Register Button -->
            <button type="submit">
                Register
            </button>

        </form>


        <!-- Login -->
        <p>
            Already have an account?
            <a href="{{ url_for('auth.login') }}">
                Login
            </a>
        </p>

    </div>

</section>

</body>

</html>
