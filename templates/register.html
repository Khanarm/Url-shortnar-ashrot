<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - aShort</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<section class="hero">

    <div class="shortener-box">

        <h1>👤 Create Account</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <p>{{ message }}</p>

            {% endfor %}

        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                minlength="3"
                maxlength="30"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                minlength="6"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="/auth/login">
                Login
            </a>
        </p>

    </div>

</section>

</body>

</html>
