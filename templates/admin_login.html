<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<section class="hero">

<div class="shortener-box">

<h1>👑 Admin Login</h1>

{% with messages = get_flashed_messages(with_categories=true) %}

{% for category, message in messages %}

<p>{{ message }}</p>

{% endfor %}

{% endwith %}

<form method="POST">

<input
    type="text"
    name="username"
    placeholder="Admin username"
    required>

<input
    type="password"
    name="password"
    placeholder="Admin password"
    required>

<button type="submit">
Login
</button>

</form>

</div>

</section>

</body>

</html>
