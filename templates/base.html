<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
{% block title %}
aShort
{% endblock %}
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<nav class="navbar">

<div class="logo">
🔗 aShort
</div>


<ul class="menu">

<li>
<a href="/">
Home
</a>
</li>


{% if session.get("user_id") %}

<li>
<a href="{{ url_for('dashboard.dashboard') }}">
Dashboard
</a>
</li>

<li>
<a href="{{ url_for('dashboard.profile') }}">
👤 Profile
</a>
</li>

<li>
<a href="{{ url_for('auth.logout') }}">
Logout
</a>
</li>

{% else %}

<li>
<a href="{{ url_for('auth.login') }}">
Login
</a>
</li>

<li>
<a href="{{ url_for('auth.register') }}">
Register
</a>
</li>

{% endif %}

</ul>

</nav>


{% block content %}

{% endblock %}


<footer>

© 2026 aShort. All Rights Reserved.

</footer>


<script
src="{{ url_for('static', filename='js/script.js') }}">
</script>

</body>

</html>
